<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>command-converter alpha-0.2 - Convert Windows commands to Debian commands</title>
    <link href="../Css/AllStyles.css" rel="stylesheet">
    <link rel="icon" href="../logo.webp">
    <script src="../js/cmd-converter.js"></script>
</head>
<body>
    <h1>Convert</h1>
    <div id="converter">
        <div class="list">
            <div class="element">
                <h2>Input</h2>
                <textarea id="IN" rows="15"></textarea>
            </div>
            <div class="element">
                <h2>Output</h2>
                <textarea id="OUT" rows="15" readonly></textarea>
            </div>
        </div>
        <select id="mode">
            <option value="windows/linux">Windows (.bat) ➜ Linux/Debian (.sh)</option>
            <option value="linux/windows">Linux/Debian (.sh) ➜ Windows (.bat)</option>
        </select>
    </div>
    <div id="warning">
        <p>WARNING: This converter may make mistakes</p>
    </div>
    <footer>
        <div>
            <p>©2024 404A Studio (html and js by Arthur CALON and style by Nitn@f10) - command-converter, all rights reserved</p>
            <a href="useterms.html">terms of use &amp; privacy policy</a>
        </div>
        <img src="../logo.webp" alt="command-converter logo" id="logo">
        <select id="language-selector">
            <option value="../FR/converter.html" id="fr">🇫🇷(FR) français</option>
            <option value="../EN/converter.html" id="en">🇬🇧(EN) english</option>
            <option value="../SP/converter.html" id="sp">🇪🇸(SP) español</option>
        </select>
    </footer>
    <script>
        document.getElementById('language-selector').addEventListener('change', function() {
            window.location.href = this.value;
        });
    </script>
</body>
</html>
